name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch changes in Home Assistant and HACS

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS check
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install aiohttp
      - run: python tests/test_engine.py
      - run: python -u tests/test_manager.py
